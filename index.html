<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" type="text/css" href="css/tokens.css">
    <link rel="stylesheet" type="text/css" href="css/styles.css">
    <link rel="stylesheet" type="text/css" href="css/dark.css">
    <link rel="stylesheet" href="css/vendor/w3.css"> 
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <title>Progress Knight</title>
    <script type="module" src="/src/main.tsx"></script>
</head>
<body id="body" class="dark">
    <script>
        // Only stops a stored light theme from flashing dark before the game's
        // script runs; applyPreferences() in src/ui/preferences.ts decides.
        // The key must match PREFERENCES_KEY there.
        try {
            var theme = JSON.parse(localStorage.getItem("pk-preferences")).theme
            if (theme === "light" || (theme === "system" && !matchMedia("(prefers-color-scheme: dark)").matches)) {
                document.body.classList.remove("dark")
            }
        } catch (error) {}
    </script>
    <div id="root"></div>
</body>
</html>
